<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>AudioDose | Smart Medication Assistant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
    * {
        transition: all 0.2s ease;
    }
    body {
        background: #0B1220;
        color: #F1F5F9;
        font-family: 'Segoe UI', system-ui, -apple-system, 'Inter', sans-serif;
    }
    .container {
        max-width: 1000px;
        margin-top: 24px;
        margin-bottom: 80px;
    }
    .card, .modal-content {
        background: #111C2E;
        border: 4px solid #1E2A3E;
        border-radius: 24px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .nav-tabs .nav-link {
        color: #CBD5E1;
        background: transparent;
        border: none;
        font-weight: 600;
        padding: 12px 24px;
    }
    .nav-tabs .nav-link.active {
        color: #60A5FA;
        background: #111C2E;
        border-bottom: 3px solid #3B82F6;
    }
    .btn-scan {
        background: #3B82F6;
        border: none;
        padding: 14px;
        border-radius: 60px;
        font-weight: bold;
        letter-spacing: 1px;
        color: white;
        box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        width: 100%;
    }
    .btn-scan:hover {
        background: #2563EB;
        transform: scale(0.98);
    }
    .scan-box {
        background: #0A111F;
        border: 2px dashed #3B82F6;
        border-radius: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        min-height: 280px;
        color: #CBD5E1;
        backdrop-filter: blur(2px);
    }
    .result-card {
        background: #0F172A;
        border-radius: 28px;
        padding: 1.2rem;
        border: 3px solid #3B82F6;
    }
    .safe-badge { background: #22C55E; color: #020617; font-weight: bold; }
    .moderate-badge { background: #FACC15; color: #1e293b; font-weight: bold; }
    .high-badge { background: #EF4444; color: white; font-weight: bold; }
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 24px;
    }
    .log-item {
        background: #1E293B;
        border-radius: 16px;
        padding: 10px 14px;
        margin-bottom: 10px;
        border-left: 4px solid #3B82F6;
    }
    .log-item strong, .log-item .text-secondary {
        color: #E2E8F0 !important;
    }
    .calendar-table td {
        height: 70px;
        cursor: pointer;
        vertical-align: middle;
        background-color: #0F172A;
        border-radius: 20px;
        transition: 0.1s;
        color: #E2E8F0;
    }
    .calendar-table td:hover {
        background-color: #1E2A44;
        transform: scale(1.02);
    }
    .selected-day {
        background-color: #3B82F6 !important;
        color: white;
        box-shadow: 0 0 0 2px #93C5FD;
    }
    .add-fab {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 64px;
        height: 64px;
        border-radius: 32px;
        background: #3B82F6;
        font-size: 28px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        border: none;
        z-index: 1050;
    }
    .add-fab:hover {
        background: #2563EB;
        transform: scale(1.05);
    }
    .time-badge {
        font-size: 0.75rem;
        background: #475569;
        border-radius: 40px;
        padding: 2px 8px;
        color: #F1F5F9;
    }
    hr {
        background-color: #1E2A3E;
    }
    .btn-outline-light {
        border-color: #475569;
        color: #E2E8F0;
    }
    .btn-outline-light:hover {
        background-color: #334155;
        color: white;
    }
    .flatpickr-input {
        background: #1E293B !important;
        border: 1px solid #3B82F6 !important;
        color: white !important;
        border-radius: 48px !important;
        padding: 12px !important;
    }
    .modal input, .modal select {
        background: #1E293B;
        border: 1px solid #3B82F6;
        color: #F1F5F9;
        border-radius: 28px;
        padding: 12px;
    }
    .modal input::placeholder {
        color: #94A3B8;
    }
    .modal input:focus {
        background: #0F172A;
        color: white;
    }
    .modal-content h5, .modal-content p {
        color: #F1F5F9;
    }
    @media (max-width: 768px) {
        .dashboard-grid { grid-template-columns: 1fr; }
        .scan-flex { flex-direction: column; align-items: center; }
        .history-split { flex-direction: column; }
    }
    .scan-flex {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .scan-preview-area { 
        flex: 1; 
        min-width: 280px;
        display: flex;
        flex-direction: column;
    }
    .result-area { flex: 1; min-width: 280px; }
    
    .scan-button-wrapper {
        margin-top: 20px;
        width: 100%;
    }
    
    .scan-box i {
        margin-bottom: 16px;
    }
    .scan-box p {
        margin-bottom: 0;
    }
    
    /* Read Aloud Button */
    .btn-read-aloud {
        background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
        border: none;
        padding: 12px;
        border-radius: 60px;
        font-weight: bold;
        color: white;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-read-aloud:hover {
        background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
        transform: scale(1.02);
    }
    
    /* Legend - FIXED: Bright visible text */
    .legend-group {
        display: flex;
        gap: 1.5rem;
        justify-content: flex-start;
        padding-left: 0.5rem;
        margin-top: 12px;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #E2E8F0;
        font-weight: 500;
    }
    .legend-item i {
        font-size: 0.9rem;
    }
    .legend-item .text-success {
        color: #4ADE80 !important;
    }
    .legend-item .text-warning {
        color: #FBBF24 !important;
    }
    .legend-item .text-info {
        color: #38BDF8 !important;
    }
    
    /* History Card Split Layout */
    .history-split {
        display: flex;
        gap: 1rem;
        width: 100%;
    }
    .schedule-section, .adherence-section {
        flex: 1;
        background: transparent;
    }
    .section-title {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: #CBD5E1;
        letter-spacing: 0.5px;
    }
    /* Schedule Box - Dark Navy Blue */
    .schedule-box {
        background: #0F172A;
        border-left: 4px solid #3B82F6;
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .schedule-box .med-name {
        font-weight: bold;
        color: #F1F5F9;
        font-size: 0.95rem;
    }
    .schedule-box .med-details {
        font-size: 0.75rem;
        color: #94A3B8;
        margin-top: 4px;
    }
    /* Adherence Box - Green transparent */
    .adherence-box {
        background: rgba(34, 197, 94, 0.12);
        border-left: 4px solid #22C55E;
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 12px;
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .adherence-box .check-icon {
        color: #22C55E;
        font-size: 1.2rem;
        flex-shrink: 0;
    }
    .adherence-content {
        flex: 1;
    }
    .adherence-content .med-name {
        font-weight: bold;
        color: #F1F5F9;
        font-size: 0.95rem;
    }
    .adherence-content .taken-time {
        font-size: 0.7rem;
        color: #86EFAC;
        margin-top: 2px;
    }
    .no-data-message {
        font-size: 0.8rem;
        color: #94A3B8;
        text-align: center;
        padding: 20px 10px;
        background: #0F172A;
        border-radius: 16px;
    }
    
    .card h5, .card h6 {
        color: #F1F5F9;
        font-weight: 600;
    }
    .text-secondary {
        color: #CBD5E1 !important;
    }
    
    /* Modal text fix - ensure inputs and labels are bright */
    .modal .form-control {
        color: #F1F5F9 !important;
        background: #1E293B !important;
    }
    .modal .form-control:focus {
        background: #0F172A !important;
        color: white !important;
    }
    .modal label, .modal .modal-title {
        color: #F1F5F9;
    }
    .modal .btn-close {
        filter: invert(1);
    }
</style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-ear-listen text-primary me-2"></i>AudioDose</h2>
    </div>

    <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="scan-tab" data-bs-toggle="tab" data-bs-target="#scanPanel" type="button" role="tab">Scan Medicine</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboardPanel" type="button" role="tab">Dashboard & Logs</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- SCAN PANEL -->
        <div class="tab-pane fade show active" id="scanPanel" role="tabpanel">
            <div id="scanLayout" class="scan-flex align-items-start">
                <div class="scan-preview-area">
                    <div class="scan-box text-center p-4">
                        <i class="fas fa-camera-retro fa-3x text-primary"></i>
                        <p class="mb-1 mt-3">Image Scanner Field</p>
                    </div>
                    <div class="scan-button-wrapper">
                        <button class="btn btn-scan" id="triggerScanBtn">
                            <i class="fas fa-qrcode me-2"></i> Scan Now
                        </button>
                    </div>
                </div>
                <div id="resultCardArea" class="result-area" style="display: none;">
                    <div class="result-card">
                        <h4 id="resMedName" class="fw-bold">-</h4>
                        <p id="resDosage" class="mb-2"><i class="fas fa-pills"></i> <span>-</span></p>
                        <div id="resRiskBadge" class="badge p-3 w-100 mb-3 fs-6 rounded-pill">🔄 Scanning...</div>
                        <p id="resMessage" class="small">Awaiting medicine identification.</p>
                        <button class="btn btn-read-aloud w-100 mt-2" id="speakResultBtn"><i class="fas fa-volume-up me-2"></i> Read Aloud</button>
                    </div>
                </div>
            </div>
            <div id="tempMessage" class="mt-3 text-center text-info"></div>
        </div>

        <!-- DASHBOARD PANEL -->
        <div class="tab-pane fade" id="dashboardPanel" role="tabpanel">
            <div class="dashboard-grid">
                <div class="card p-3">
                    <h5><i class="fas fa-history me-2 text-primary"></i>Medicine Logs</h5>
                    <div id="logListContainer" style="max-height: 800px; overflow-y: auto;">
                        <p class="text-secondary">📭 No logs yet. Scan or use + button.</p>
                    </div>
                </div>
                <div>
                    <div class="card p-3 mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <button class="btn btn-sm btn-outline-light" id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
                            <h5 id="monthLabel" class="m-0">May 2026</h5>
                            <button class="btn btn-sm btn-outline-light" id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <table class="table table-dark table-bordered text-center calendar-table mt-3">
                            <thead><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr></thead>
                            <tbody id="calendarBody"></tbody>
                        </table>
                        <!-- Legend with bright visible text -->
                        <div class="legend-group">
                            <span class="legend-item"><i class="fas fa-check-circle text-success"></i> Taken</span>
                            <span class="legend-item"><i class="fas fa-calendar-day text-warning"></i> Today</span>
                            <span class="legend-item"><i class="fas fa-clock text-info"></i> Upcoming</span>
                        </div>
                    </div>
                    <!-- Redesigned History Card: Split Layout -->
                    <div class="card p-3">
                        <h6><i class="fas fa-clipboard-list me-2"></i>Daily Medication Summary</h6>
                        <div id="dayHistoryPanel" class="history-split" style="min-height: 240px;">
                            <!-- Dynamic content injected -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FLOATING ADD BUTTON -->
<button class="add-fab btn btn-primary" id="manualAddFab" data-bs-toggle="modal" data-bs-target="#manualLogModal">
    <i class="fas fa-plus"></i>
</button>

<!-- MODALS with fixed text visibility -->
<div class="modal fade" id="manualLogModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <h5 class="mb-3"><i class="fas fa-edit text-primary"></i> Manually Add Taken Medicine</h5>
            <input type="text" id="manualMedName" class="form-control mb-3" placeholder="Medicine name (e.g., Amlodipine)">
            <input type="text" id="manualDosage" class="form-control mb-3" placeholder="Dosage (e.g., 10mg)">
            <input type="text" id="manualTimePicker" class="form-control mb-3" placeholder="Select time taken">
            <button class="btn btn-success w-100" id="confirmManualAddBtn"><i class="fas fa-save"></i> Add to Log</button>
        </div>
    </div>
</div>

<div class="modal fade" id="scheduleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4">
            <h5 class="mb-3"><i class="fas fa-calendar-plus text-primary"></i> Schedule Medicine</h5>
            <input type="text" id="schedName" class="form-control mb-3" placeholder="Medicine name (e.g., Amlodipine)">
            <input type="text" id="schedDosage" class="form-control mb-3" placeholder="Dosage (e.g., 10mg)">
            <input type="text" id="schedTimePicker" class="form-control mb-3" placeholder="Scheduled time (e.g., 08:00)">
            <button class="btn btn-primary w-100" id="saveScheduleBtn">Set Schedule</button>
        </div>
    </div>
</div>

<div class="modal fade" id="takeConfirmModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 text-center">
            <i class="fas fa-question-circle fa-3x text-warning mb-2"></i>
            <h5>Did you take the medicine?</h5>
            <div class="d-flex gap-3 mt-3 justify-content-center">
                <button class="btn btn-success px-4" id="confirmYesBtn">Yes, taken</button>
                <button class="btn btn-danger px-4" id="confirmNoBtn">No, remind me</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // DATA MODELS
    let medicationLogs = [];
    let schedules = {};
    
    let currentCalendarDate = new Date(2026, 4, 1);
    let selectedDateStr = null;
    let lastScannedMedicine = null;
    
    function getTodayStr() { return new Date().toISOString().split('T')[0]; }
    
    function computeRisk(scheduledTimeStr, actualTimeStr, medicineMatch) {
        if (!medicineMatch) return { level: "High Risk", score: 10, message: "Medicine not scheduled. DO NOT TAKE." };
        if (!scheduledTimeStr) return { level: "Moderate Risk", score: 4, message: "No schedule time found." };
        const [schedHour, schedMin] = scheduledTimeStr.split(':').map(Number);
        const [actualHour, actualMin] = actualTimeStr.split(':').map(Number);
        const diffMins = Math.abs((schedHour*60+schedMin) - (actualHour*60+actualMin));
        if (diffMins > 120) return { level: "High Risk", score: 8, message: "Taken far outside scheduled time (>2h)." };
        if (diffMins > 30) return { level: "Moderate Risk", score: 3, message: "Taken >30 min from schedule." };
        return { level: "Safe", score: 0, message: "Taken on time. Well done!" };
    }
    
    function addLogEntry(medicine, dosage, timeStr, dateStr, riskLevel, riskMessage) {
        medicationLogs.unshift({ medicine, dosage, timeTaken: timeStr, date: dateStr, riskLevel, riskMessage, timestampISO: Date.now() });
        updateLogsUI();
        if (document.getElementById('dashboardPanel').classList.contains('show') && selectedDateStr) refreshHistoryPanel(selectedDateStr);
    }
    
    function updateLogsUI() {
        const container = $("#logListContainer");
        if (!medicationLogs.length) { container.html('<p class="text-secondary">📭 No logs yet. Scan or use + button.</p>'); return; }
        let html = "";
        medicationLogs.forEach(log => {
            let riskClass = log.riskLevel === "Safe" ? "safe-badge" : (log.riskLevel === "Moderate Risk" ? "moderate-badge" : "high-badge");
            html += `<div class="log-item">
                        <div class="d-flex justify-content-between">
                            <strong><i class="fas fa-capsules"></i> ${log.medicine} (${log.dosage})</strong>
                            <span class="time-badge">${log.timeTaken}</span>
                        </div>
                        <div><small class="text-secondary">${log.date}</small></div>
                        <span class="badge ${riskClass} mt-1 px-3">${log.riskLevel}</span>
                        <div class="small text-muted mt-1">${log.riskMessage}</div>
                    </div>`;
        });
        container.html(html);
    }
    
    const mockMeds = [
        { name: "Amlodipine", dosage: "5mg" },
        { name: "Metformin", dosage: "500mg" },
        { name: "Lisinopril", dosage: "10mg" },
        { name: "Atorvastatin", dosage: "20mg" }
    ];
    function getRandomMedicine() { return mockMeds[Math.floor(Math.random() * mockMeds.length)]; }
    
    let currentScanTimeout = null;
    function scanMedicineAction() {
        const scanned = getRandomMedicine();
        const today = getTodayStr();
        const matchedSched = (schedules[today] || []).find(s => s.medicine.toLowerCase() === scanned.name.toLowerCase());
        
        $("#resultCardArea").fadeIn(200);
        $("#resMedName").html(`💊 ${scanned.name}`);
        $("#resDosage").html(`<i class="fas fa-pills"></i> ${scanned.dosage}`);
        
        if (matchedSched) {
            $("#resRiskBadge").removeClass().addClass("badge p-3 w-100 mb-3 fs-6 rounded-pill safe-badge").text("✅ SAFE - Scheduled Medicine");
            $("#resMessage").html(`✔️ Correct medicine: ${scanned.name}. Scheduled at ${matchedSched.time}.`);
            lastScannedMedicine = { medicine: scanned.name, dosage: scanned.dosage, scheduledTime: matchedSched.time, matched: true };
            if (currentScanTimeout) clearTimeout(currentScanTimeout);
            currentScanTimeout = setTimeout(() => {
                new bootstrap.Modal(document.getElementById('takeConfirmModal')).show();
            }, 2000);
        } else {
            $("#resRiskBadge").removeClass().addClass("badge p-3 w-100 mb-3 fs-6 rounded-pill high-badge").text("⛔ HIGH RISK - Wrong Medicine");
            $("#resMessage").html(`⚠️ ALERT: ${scanned.name} is NOT scheduled for today. DO NOT TAKE.`);
            lastScannedMedicine = { medicine: scanned.name, dosage: scanned.dosage, scheduledTime: null, matched: false };
            if (currentScanTimeout) clearTimeout(currentScanTimeout);
        }
        window.currentSpeakText = `Medicine ${scanned.name} ${scanned.dosage}. ${matchedSched ? "Matches your schedule. Safe to take." : "Not scheduled. Do not take."}`;
    }
    
    function speakLastResult() {
        if (window.currentSpeakText) {
            const utterance = new SpeechSynthesisUtterance(window.currentSpeakText);
            utterance.rate = 0.9;
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        } else { speechSynthesis.speak(new SpeechSynthesisUtterance("No medicine scanned.")); }
    }
    
    function confirmTakenMedicine() {
        if (!lastScannedMedicine) return;
        const now = new Date();
        const currentTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        const todayStr = getTodayStr();
        let riskEval = lastScannedMedicine.matched && lastScannedMedicine.scheduledTime 
            ? computeRisk(lastScannedMedicine.scheduledTime, currentTime, true)
            : { level: "High Risk", message: "Unscheduled medication." };
        addLogEntry(lastScannedMedicine.medicine, lastScannedMedicine.dosage, currentTime, todayStr, riskEval.level, riskEval.message);
        showTemporaryMessage(`✅ Logged: ${lastScannedMedicine.medicine} at ${currentTime}`);
        bootstrap.Modal.getInstance(document.getElementById('takeConfirmModal'))?.hide();
        lastScannedMedicine = null;
    }
    
    function cancelReminder() {
        bootstrap.Modal.getInstance(document.getElementById('takeConfirmModal'))?.hide();
        showTemporaryMessage("⚠️ Please remember to take your medicine on time.");
    }
    
    function showTemporaryMessage(msg) {
        let tempDiv = $("#tempMessage");
        tempDiv.html(`<div class="alert alert-info alert-dismissible fade show" role="alert">${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`);
        setTimeout(() => tempDiv.html(""), 3000);
    }
    
    // Calendar Helpers
    function formatDateYYYYMMDD(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    
    function renderCalendar() {
        const year = currentCalendarDate.getFullYear(), month = currentCalendarDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month+1, 0).getDate();
        const todayStr = getTodayStr();
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        $("#monthLabel").text(`${monthNames[month]} ${year}`);
        let tbody = $("#calendarBody");
        tbody.empty();
        let row = "<tr>";
        for(let i=0;i<firstDay;i++) row += "<td></td>";
        let dayCounter = 1;
        for(let i=firstDay; i<7 && dayCounter<=daysInMonth; i++) {
            let dateObj = new Date(year, month, dayCounter);
            let dateStr = formatDateYYYYMMDD(dateObj);
            let takenCount = medicationLogs.filter(l => l.date === dateStr).length;
            let isPast = dateStr < todayStr, isToday = dateStr === todayStr;
            let icon = isPast ? "🟢" : (isToday ? "🟡" : "🔴");
            row += `<td data-date="${dateStr}" class="cal-cell">${dayCounter}<br><span class="small">${icon}</span><br>${takenCount>0?`📋${takenCount}`:''}</td>`;
            dayCounter++;
        }
        row += "</table>";
        tbody.append(row);
        while(dayCounter <= daysInMonth) {
            row = "<tr>";
            for(let i=0; i<7 && dayCounter<=daysInMonth; i++) {
                let dateObj = new Date(year, month, dayCounter);
                let dateStr = formatDateYYYYMMDD(dateObj);
                let takenCount = medicationLogs.filter(l => l.date === dateStr).length;
                let isPast = dateStr < todayStr, isToday = dateStr === todayStr;
                let icon = isPast ? "🟢" : (isToday ? "🟡" : "🔴");
                row += `<td data-date="${dateStr}" class="cal-cell">${dayCounter}<br><span class="small">${icon}</span><br>${takenCount>0?`📋${takenCount}`:''}</td>`;
                dayCounter++;
            }
            row += "</tr>";
            tbody.append(row);
        }
        $(".cal-cell").click(function() {
            let dStr = $(this).data("date");
            if(!dStr) return;
            selectedDateStr = dStr;
            $(".cal-cell").removeClass("selected-day");
            $(this).addClass("selected-day");
            if(dStr >= getTodayStr()) {
                $("#scheduleModal").modal("show");
                window.pendingScheduleDate = dStr;
            } else {
                refreshHistoryPanel(dStr);
            }
        });
    }
    
    // Refresh split panel with Schedule (left) and Adherence (right)
    function refreshHistoryPanel(dateStr) {
        const schedulesForDay = schedules[dateStr] || [];
        const takenLogsForDay = medicationLogs.filter(l => l.date === dateStr);
        
        let scheduleHtml = `<div class="schedule-section"><div class="section-title"><i class="fas fa-calendar-alt me-1"></i> Medication Schedule</div>`;
        if(schedulesForDay.length === 0) {
            scheduleHtml += `<div class="no-data-message">No medicines scheduled for this day.</div>`;
        } else {
            schedulesForDay.forEach(sched => {
                scheduleHtml += `
                    <div class="schedule-box">
                        <div class="med-name">💊 ${sched.medicine} (${sched.dosage})</div>
                        <div class="med-details"><i class="far fa-clock"></i> Schedule: ${sched.time}</div>
                    </div>
                `;
            });
        }
        scheduleHtml += `</div>`;
        
        let adherenceHtml = `<div class="adherence-section"><div class="section-title"><i class="fas fa-clipboard-check me-1"></i> Adherence Report</div>`;
        if(takenLogsForDay.length === 0) {
            adherenceHtml += `<div class="no-data-message">No recorded intake for this day.</div>`;
        } else {
            takenLogsForDay.forEach(log => {
                adherenceHtml += `
                    <div class="adherence-box">
                        <div class="check-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="adherence-content">
                            <div class="med-name">${log.medicine} (${log.dosage})</div>
                            <div class="taken-time"><i class="fas fa-hourglass-half"></i> Taken at: ${log.timeTaken}</div>
                        </div>
                    </div>
                `;
            });
        }
        adherenceHtml += `</div>`;
        
        $("#dayHistoryPanel").html(`<div class="history-split" style="width:100%; display:flex; gap:1rem;">${scheduleHtml}${adherenceHtml}</div>`);
    }
    
    function saveScheduleForDate() {
        let targetDate = window.pendingScheduleDate;
        if(!targetDate) targetDate = getTodayStr();
        const medName = $("#schedName").val().trim();
        const dosage = $("#schedDosage").val().trim();
        const schedTime = $("#schedTimePicker").val();
        if(!medName || !dosage || !schedTime) { alert("Please fill all fields"); return; }
        if(!schedules[targetDate]) schedules[targetDate] = [];
        schedules[targetDate].push({ medicine: medName, dosage: dosage, time: schedTime });
        bootstrap.Modal.getInstance(document.getElementById('scheduleModal'))?.hide();
        $("#schedName, #schedDosage, #schedTimePicker").val("");
        renderCalendar();
        if(selectedDateStr === targetDate) refreshHistoryPanel(targetDate);
        showTemporaryMessage(`✅ Scheduled ${medName} for ${targetDate} at ${schedTime}`);
    }
    
    function manualAddMedicine() {
        let med = $("#manualMedName").val().trim();
        let dosage = $("#manualDosage").val().trim();
        let takenTime = $("#manualTimePicker").val();
        if(!med || !dosage || !takenTime) { alert("Enter all fields"); return; }
        let todayStr = getTodayStr();
        let schedForToday = schedules[todayStr] || [];
        let matchSched = schedForToday.find(s => s.medicine.toLowerCase() === med.toLowerCase());
        let riskResult = matchSched ? computeRisk(matchSched.time, takenTime, true) : { level: "High Risk (Unplanned)", message: "Not scheduled." };
        addLogEntry(med, dosage, takenTime, todayStr, riskResult.level, riskResult.message);
        bootstrap.Modal.getInstance(document.getElementById('manualLogModal'))?.hide();
        $("#manualMedName, #manualDosage, #manualTimePicker").val("");
        renderCalendar();
        if(selectedDateStr === todayStr) refreshHistoryPanel(todayStr);
        showTemporaryMessage(`➕ Manually added: ${med} at ${takenTime}`);
    }
    
    $(document).ready(function() {
        flatpickr("#manualTimePicker", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, defaultHour: new Date().getHours(), defaultMinute: new Date().getMinutes() });
        flatpickr("#schedTimePicker", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
        
        $("#triggerScanBtn").click(scanMedicineAction);
        $("#speakResultBtn").click(speakLastResult);
        $("#confirmYesBtn").click(confirmTakenMedicine);
        $("#confirmNoBtn").click(cancelReminder);
        $("#saveScheduleBtn").click(saveScheduleForDate);
        $("#confirmManualAddBtn").click(manualAddMedicine);
        
        $("#prevMonthBtn").click(() => { currentCalendarDate.setMonth(currentCalendarDate.getMonth()-1); renderCalendar(); });
        $("#nextMonthBtn").click(() => { currentCalendarDate.setMonth(currentCalendarDate.getMonth()+1); renderCalendar(); });
        
        renderCalendar();
        updateLogsUI();
        
        let todayDemo = getTodayStr();
        if(!schedules[todayDemo]) schedules[todayDemo] = [];
        if(schedules[todayDemo].length === 0) {
            schedules[todayDemo].push({ medicine: "Amlodipine", dosage: "5mg", time: "08:00" });
            schedules[todayDemo].push({ medicine: "Metformin", dosage: "500mg", time: "20:00" });
        }
        renderCalendar();
    });
</script>
